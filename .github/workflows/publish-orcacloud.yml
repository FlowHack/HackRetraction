name: Publish to OrcaCloud

# Публикация в OrcaCloud через OIDC (trusted publishing, без токенов/секретов).
# OrcaCloud принимает OIDC-токен ТОЛЬКО от workflow, запущенного событием
# `release: published` (проверяет claims: event_name=release + repository_id).
# Push-триггер по тегу не подходит: OrcaCloud отвечает HTTP 401
# "A valid GitHub Actions OIDC token from a connected release workflow is required".
#
# Запуск:
#   - release: published — релиз создан (вручную в UI GitHub или release.yml
#     с secrets.RELEASE_TOKEN, см. release.yml). Версия = имя тега релиза,
#     changelog = RELEASE_NOTES_ORCA_SLICER.md из коммита тега (fallback — тело
#     релиза для старых тегов без этого файла).
#   - workflow_dispatch — ручной повтор публикации для уже существующего тега
#     (например, v0.1.1, выпущенного до ввода этой схемы). Обязателен input tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза для публикации (например v0.1.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Публикация версии в OrcaCloud
    runs-on: ubuntu-latest
    steps:
      - name: Определение тега и версии
        id: release
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ inputs.tag }}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Неверный тег релиза: $tag (ожидается vX.Y.Z)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сборка wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel
          python tools/patch_wheel.py dist/*.whl

      - name: Проверка wheel перед публикацией
        run: |
          python - <<'EOF'
          import glob
          import zipfile
          from hackretraction.version import __version__ as version

          whl = glob.glob("dist/*.whl")
          if len(whl) != 1:
              raise SystemExit(f"Ожидался ровно один .whl, получено: {whl}")
          archive = zipfile.ZipFile(whl[0])
          names = archive.namelist()
          bad = [n for n in names if any(
              p in n for p in ("docs/", "fork/", "assets/", "stubs/", "tests/")
          )]
          if bad:
              raise SystemExit(f"В wheel попали лишние файлы: {bad}")
          metadata_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
          metadata = archive.read(metadata_name).decode("utf-8")
          if "Name: HackRetraction" not in metadata:
              raise SystemExit("В METADATA нет человекочитаемого имени 'Name: HackRetraction'")
          if "Import-Name: hackretraction" not in metadata:
              raise SystemExit("В METADATA нет 'Import-Name: hackretraction'")
          if f"Version: {version}" not in metadata:
              raise SystemExit(f"METADATA не содержит Version: {version}")
          print(f"OK: {whl[0]}, версия {version}")
          EOF

      - name: Публикация версии в OrcaCloud
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"

          if [[ -f RELEASE_NOTES_ORCA_SLICER.md ]]; then
            # Приоритет: файл из коммита тега. GitHub-релиз при этом несёт
            # RELEASE_NOTES.md (markdown), а текст для OrcaCloud — из этого файла.
            cp RELEASE_NOTES_ORCA_SLICER.md changelog_full.txt
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            # Fallback: старые теги без RELEASE_NOTES_ORCA_SLICER.md.
            jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" > changelog_full.txt
          else
            : > changelog_full.txt
          fi
          head -c 4000 changelog_full.txt > changelog.txt
          metadata="$(jq -cn --arg version "$version" --rawfile changelog changelog.txt \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"

          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in dist/*.whl; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -le 1 ]; then
            echo "::error::Не найдено ни одного .whl для публикации в OrcaCloud"
            exit 1
          fi

          oidc_token="$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=orcacloud" | jq -r '.value')"
          if [ -z "$oidc_token" ] || [ "$oidc_token" = "null" ]; then
            echo "::error::Не удалось получить OIDC-токен GitHub (проверьте permissions: id-token: write)"
            exit 1
          fi

          echo "::group::OIDC claims GitHub (диагностика публикации)"
          OIDC_TOKEN="$oidc_token" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub", "repository", "repository_id",
                      "repository_owner", "ref", "event_name", "workflow_ref",
                      "job_workflow_ref", "run_id", "sha"):
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY
          echo "::endgroup::"

          status="$(curl -sS -o orcacloud-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${oidc_token}" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat orcacloud-response.json
          echo
          case "$status" in
            200|201) ;;
            *)
              echo "::error::OrcaCloud вернул HTTP $status — версия $version не опубликована"
              exit 1
              ;;
          esac
          echo "Версия $version опубликована в OrcaCloud"