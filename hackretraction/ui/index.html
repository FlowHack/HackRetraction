<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackRetraction</title>
<style>/*STYLE*/</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">H</span>
      <span class="brand-name">HackRetraction</span>
    </div>
    <div class="toolbar">
      <button id="btn-pull" class="btn" data-toolbar="pull">Pull</button>
      <button id="btn-reset" class="btn" data-toolbar="reset">Reset</button>
      <button id="btn-load" class="btn" data-toolbar="load">Load</button>
      <button id="btn-generate" class="btn primary" data-toolbar="generate">Generate</button>
      <button id="btn-copy" class="btn" data-toolbar="copy">Copy</button>
      <button id="btn-save" class="btn" data-toolbar="save">Save</button>
      <button id="btn-settings" class="btn icon" title="Settings">&#9881;</button>
      <button id="btn-support" class="btn icon" title="Support project">&#9829;</button>
    </div>
  </header>
  <input type="file" id="file-input" accept=".gcode,.gco,.g,.nc,text/plain" hidden>

  <main class="layout">
    <section id="params-panel" class="panel params">
      <!-- Поля параметров строятся JS из ui-бандла -->
    </section>

    <section id="preview-panel" class="panel preview">
      <div class="preview-tabs">
        <button class="ptab active" data-view="top" id="tab-top">Top</button>
        <button class="ptab" data-view="side" id="tab-side">Side</button>
      </div>
      <div class="preview-wrap">
        <svg id="preview" width="100%" height="100%"></svg>
      </div>
    </section>
  </main>

  <footer id="status" class="statusbar">
    <span id="status-text"></span>
  </footer>
</div>

<!-- Модалка настроек -->
<div id="settings-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <span data-text="btn.settings">Settings</span>
      <button class="modal-close" id="settings-close">&#10005;</button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span data-text="set.theme">Theme</span>
        <select id="set-theme">
          <option value="auto" data-text="set.theme_auto">Auto</option>
          <option value="dark" data-text="set.theme_dark">Dark</option>
          <option value="light" data-text="set.theme_light">Light</option>
        </select>
      </label>
      <label class="field">
        <span data-text="set.font_size">Font size</span>
        <select id="set-font-size"></select>
      </label>
      <label class="field">
        <span data-text="set.font">Font</span>
        <select id="set-font">
          <option value="system" data-text="set.font_system">System</option>
          <option value="mono" data-text="set.font_mono">Monospace</option>
        </select>
      </label>
      <label class="field">
        <span data-text="set.language">Language</span>
        <select id="set-language">
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="sr">Srpski</option>
        </select>
      </label>
      <label class="field">
        <span data-text="set.comment_lang">G-code comments language</span>
        <select id="set-comment-lang">
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="sr">Srpski</option>
        </select>
      </label>
    </div>
  </div>
</div>

<!-- Модалка поддержки -->
<div id="support-modal" class="modal-overlay hidden">
  <div class="modal support">
    <div class="modal-head">
      <span data-text="btn.support">Support project</span>
      <button class="modal-close" id="support-close">&#10005;</button>
    </div>
    <div class="modal-body support-body">
      <div class="support-heart">&#9829;</div>
      <p data-text="support.text">HackRetraction is free and open source. If you find it useful, consider supporting the development.</p>
      <div class="support-links">
        <a id="support-link" href="#" target="_blank" rel="noopener" class="btn primary" data-text="support.open">Open support page</a>
      </div>
    </div>
  </div>
</div>

<script>/*SCRIPT*/</script>
</body>
</html>
